name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # ВАЖНО: разрешить создавать релиз
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ./BrowserGuard/BrowserGuard.csproj

    - name: Publish
      run: |
        dotnet publish ./BrowserGuard/BrowserGuard.csproj -c Release -o publish

    - name: Create ZIP
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./BrowserGuard-${{ github.ref_name }}.zip

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v1
      with:
        files: ./BrowserGuard-${{ github.ref_name }}.zip
        name: Release ${{ github.ref_name }}
        body: |
          🚀 Automatic release for version ${{ github.ref_name }}
          
          ## What's inside:
          - BrowserGuard.exe (main executable)
          - All required .NET dependencies
          - Configuration files (if any)
          
          ## How to use:
          1. Download the ZIP file
          2. Extract to any folder
          3. Run BrowserGuard.exe
          
          ## System requirements:
          - Windows 10 or later
          - .NET Framework 4.8+
        draft: false
        prerelease: false